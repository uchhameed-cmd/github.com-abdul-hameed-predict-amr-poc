name: ASK-T2D real NHANES pilot
on:
  push:
    paths:
      - 'ASK-T2D/pilot_v2.py'
      - 'ASK-T2D/pilot_v3.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nhanes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: pip install pandas numpy scipy scikit-learn requests
      - name: Run experiment on CDC public XPT files
        run: python ASK-T2D/pilot_v3.py
      - name: Commit verifiable JSON results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ASK-T2D/results/
          git commit -m "Add executed NHANES pilot metrics" || true
          git push
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ask-t2d-experiment-artifacts
          path: ASK-T2D/results/
          if-no-files-found: warn
